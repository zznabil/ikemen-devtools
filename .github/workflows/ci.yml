name: ikemen-devtools baseline

on:
  push:
  pull_request:

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.x"

      - name: Go format check
        run: |
          cd _upstream/ikemen-devtools
          FILES="$(gofmt -s -l .)"
          if [ -n "$FILES" ]; then
            echo "Go files not formatted:"
            echo "$FILES"
            exit 1
          fi

      - name: Test
        run: |
          cd _upstream/ikemen-devtools
          go test ./...

      - name: Vet
        run: |
          cd _upstream/ikemen-devtools
          go vet ./...

      - name: Race
        run: |
          cd _upstream/ikemen-devtools
          go test -race ./...

      - name: Fuzz smoke
        run: |
          cd _upstream/ikemen-devtools
          go test -run=^$ -fuzz=FuzzParseContract -fuzztime=5s ./internal/parser
